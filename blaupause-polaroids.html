<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>


<style>
:root{
  --bg:#06111f;
  --grid:rgba(130,190,240,.16);
  --grid-soft:rgba(130,190,240,.07);
  --text:#eaf6ff;
  --muted:rgba(234,246,255,.62);
  --accent:#7bc7ff;
  --yellow:#f2c94c;
  --black:#05070a;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  background:var(--bg);
}

body{
  min-height:100vh;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Arial, Helvetica, sans-serif;
}

a{
  color:inherit;
  text-decoration:none;
}

.nav{
  position:fixed;
  top:0;
  right:0;
  z-index:20;
  padding:30px 48px;
  display:flex;
  gap:30px;
  font-size:10px;
  letter-spacing:.22em;
  text-transform:uppercase;
}

.nav a{
  color:var(--muted);
  position:relative;
  padding-bottom:6px;
}

.nav a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:0;
  width:0;
  height:1px;
  background:var(--accent);
  transition:.35s ease;
}

.nav a:hover::after{
  width:100%;
}

.page{
  position:relative;
  min-height:100vh;
  display:grid;
  place-items:center;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 44%, rgba(28,89,138,.34), transparent 34%),
    linear-gradient(160deg,#06111f,#07182a 54%,#03070d);
}

.grid{
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px),
    linear-gradient(var(--grid-soft) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-soft) 1px, transparent 1px);
  background-size:
    120px 120px,
    120px 120px,
    24px 24px,
    24px 24px;
  opacity:.85;
}

.scan{
  position:absolute;
  inset:0;
  height:22vh;
  background:linear-gradient(
    180deg,
    transparent,
    rgba(123,199,255,.12),
    transparent
  );
  animation:scanMove 7s ease-in-out infinite;
  opacity:.6;
}

.content{
  position:relative;
  z-index:5;
  text-align:center;
  padding:40px 24px;
}

h1{
  font-family:Georgia, "Times New Roman", serif;
  font-size:clamp(42px,7vw,96px);
  line-height:.95;
  font-weight:400;
  letter-spacing:-.04em;
}

h1 span{
  color:var(--accent);
  font-style:italic;
}

.scene{
  position:absolute;
  left:50%;
  bottom:13%;
  width:min(720px,90vw);
  height:180px;
  transform:translateX(-50%);
  z-index:6;
}

.road{
  position:absolute;
  left:0;
  right:0;
  bottom:24px;
  height:34px;
  overflow:hidden;
  border-top:2px dashed rgba(234,246,255,.32);
}

.road::before{
  content:"";
  position:absolute;
  left:-50%;
  top:16px;
  width:200%;
  height:2px;
  background:repeating-linear-gradient(
    90deg,
    rgba(234,246,255,.42) 0 30px,
    transparent 30px 58px
  );
  animation:roadMove 1.1s linear infinite;
}

.bulldozer{
  position:absolute;
  left:50%;
  bottom:34px;
  width:210px;
  height:105px;
  transform:translateX(-50%);
}

.body{
  position:absolute;
  left:46px;
  bottom:32px;
  width:112px;
  height:46px;
  background:var(--yellow);
  border:4px solid var(--black);
}

.cabin{
  position:absolute;
  left:94px;
  bottom:76px;
  width:54px;
  height:46px;
  background:var(--yellow);
  border:4px solid var(--black);
  transform:skewX(-10deg);
}

.blade{
  position:absolute;
  left:158px;
  bottom:26px;
  width:54px;
  height:44px;
  background:#d9dee5;
  border:4px solid var(--black);
  transform:skewX(-18deg);
}

.track{
  position:absolute;
  left:28px;
  bottom:10px;
  width:132px;
  height:28px;
  background:var(--black);
  border-radius:18px;
  overflow:hidden;
}

.track::before{
  content:"";
  position:absolute;
  inset:5px;
  background:repeating-linear-gradient(
    90deg,
    #555 0 10px,
    #222 10px 20px
  );
  border-radius:14px;
  animation:trackMove .45s linear infinite;
}

.wheel{
  position:absolute;
  bottom:15px;
  width:16px;
  height:16px;
  border-radius:50%;
  background:#666;
  border:3px solid #222;
  z-index:3;
  animation:wheelSpin .45s linear infinite;
}

.wheel.one{
  left:48px;
}

.wheel.two{
  left:128px;
}

.light{
  position:absolute;
  left:148px;
  bottom:58px;
  width:70px;
  height:26px;
  background:linear-gradient(90deg, rgba(242,201,76,.4), transparent);
  clip-path:polygon(0 35%,100% 0,100% 100%,0 65%);
  animation:blink 1.6s ease-in-out infinite;
}

.corners{
  position:absolute;
  inset:28px;
  pointer-events:none;
  border:1px solid rgba(123,199,255,.13);
}

@keyframes scanMove{
  0%{transform:translateY(-30vh);}
  50%{transform:translateY(105vh);}
  100%{transform:translateY(-30vh);}
}

@keyframes roadMove{
  from{transform:translateX(0);}
  to{transform:translateX(58px);}
}

@keyframes trackMove{
  from{transform:translateX(0);}
  to{transform:translateX(-20px);}
}

@keyframes wheelSpin{
  from{transform:rotate(0);}
  to{transform:rotate(360deg);}
}

@keyframes blink{
  0%,100%{opacity:.35;}
  50%{opacity:.8;}
}

@media(max-width:760px){
  .nav{
    left:0;
    right:auto;
    padding:18px;
    gap:14px;
    font-size:9px;
    flex-wrap:wrap;
  }

  .scene{
    bottom:10%;
    transform:translateX(-50%) scale(.82);
  }
}
</style>
</head>

<body>

<nav class="nav">
  <a href="index.html">01 Landingpage</a>
  <a href="blaupause-polaroids.html">02 Blaupause-Polaroids</a>
  <a href="kontakt.html">03 Kontakt</a>
</nav>

<main class="page">
  <div class="grid"></div>
  <div class="scan"></div>
  <div class="corners"></div>

  <section class="content">
    <h1>
      This Site is<br>
      <span>under Construction</span>
    </h1>
  </section>

  <div class="scene">
    <div class="road"></div>

    <div class="bulldozer">
      <div class="light"></div>
      <div class="cabin"></div>
      <div class="body"></div>
      <div class="blade"></div>
      <div class="track"></div>
      <div class="wheel one"></div>
      <div class="wheel two"></div>
    </div>
  </div>
</main>

</body>
</html>
